# Fly.io config. Replace the app name, then see README "Deploy to Fly.io".
app = "headsup-vs-bot"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  DB_PATH = "/data/poker.db"
  PORT = "8000"
  CLIENT_IP_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "poker_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Matches live in memory: keep exactly one machine running and never auto-stop it mid-match.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
