# fly.toml app configuration file generated for jumpstreetpokerbot on 2026-11-16T15:23:12Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'jumpstreetpokerbot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  DB_PATH = '/data/poker.db'
  PORT = '8000'

[[mounts]]
  source = 'poker_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
